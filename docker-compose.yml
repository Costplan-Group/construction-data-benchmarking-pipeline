# SQL Server for local integration tests.
# Usage:
#   copy .env.docker.example .env.docker   # optional; compose has defaults
#   docker compose up -d
#   .\database\docker\apply_schema.ps1
#   $env:RUN_SQL_INTEGRATION=1; pytest tests/integration -m integration

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: benchmarking-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Password123}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mssql_data:
